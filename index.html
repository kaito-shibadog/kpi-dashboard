<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>経営ダッシュボード v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .tab-btn { padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-btn:not(.active) { color: #666; background: #f0f0f0; }
    .tab-btn:hover { background: #e5e7eb; }
    .card { background: white; border-radius: 8px; border: 1px solid #e5e7eb; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #1f2937; }
    .chart-container { position: relative; height: 400px; margin-bottom: 24px; }
    .table-container { overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: right; }
    th { background: #f9fafb; font-weight: 600; }
    td:first-child, th:first-child { text-align: left; }
    .error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 12px; border-radius: 6px; }
    .loading { text-align: center; padding: 20px; color: #999; }
  </style>
</head>
<body class="bg-gray-50">

<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-gray-900">経営ダッシュボード (FY25: 11月〜FY26: 10月)</h1>
    <div class="text-xs text-gray-500" id="last-updated"></div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-6">

  <!-- Tab Navigation -->
  <div class="flex gap-3 mb-6 border-b border-gray-200 pb-3 overflow-x-auto">
    <button class="tab-btn active" onclick="switchTab('accounting', this)">会計</button>
    <button class="tab-btn" onclick="switchTab('indicators', this)">事業指標</button>
    <button class="tab-btn" onclick="switchTab('comparison', this)">昨対比</button>
    <button class="tab-btn" onclick="switchTab('pipeline', this)">パイプライン</button>
  </div>

  <!-- 会計タブ -->
  <div id="accounting-tab">
    <div id="accounting-content" class="loading">読み込み中...</div>
  </div>

  <!-- 事業指標タブ -->
  <div id="indicators-tab" class="hidden">
    <div id="indicators-content" class="loading">読み込み中...</div>
  </div>

  <!-- 昨対比タブ -->
  <div id="comparison-tab" class="hidden">
    <div id="comparison-content" class="loading">読み込み中...</div>
  </div>

  <!-- パイプラインタブ -->
  <div id="pipeline-tab" class="hidden">
    <div id="pipeline-content" class="loading">読み込み中...</div>
  </div>

</main>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw5Oqel437ID97nr5JZGVzE0dYvxpfDYqwVNkcmT7yKGyftqhL6bSxFEnFp-3RIDQ70mA/exec';

let allData = {};
const chartInstances = {}; // Chart.js instances

async function init() {
  try {
    console.log('Fetching data from GAS...');
    const response = await fetch(GAS_URL, { mode: 'cors' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    allData = await response.json();
    console.log('Data loaded:', allData);

    if (allData.error) {
      showError('GAS Error: ' + allData.error);
      return;
    }

    if (allData.updatedAt) {
      document.getElementById('last-updated').textContent =
        `最終更新: ${new Date(allData.updatedAt).toLocaleString('ja-JP')}`;
    }

    renderAccounting();
  } catch (err) {
    console.error('Init error:', err);
    showError(`エラー: ${err.message}`);
  }
}

function showError(msg) {
  document.getElementById('accounting-content').innerHTML = `<div class="error">${msg}</div>`;
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab, btn) {
  // Hide all tabs
  document.getElementById('accounting-tab').classList.add('hidden');
  document.getElementById('indicators-tab').classList.add('hidden');
  document.getElementById('comparison-tab').classList.add('hidden');
  document.getElementById('pipeline-tab').classList.add('hidden');

  // Remove active from all buttons
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  // Show selected tab & button
  btn.classList.add('active');
  document.getElementById(tab + '-tab').classList.remove('hidden');

  // Render content
  if (tab === 'accounting') renderAccounting();
  else if (tab === 'indicators') renderIndicators();
  else if (tab === 'comparison') renderComparison();
  else if (tab === 'pipeline') renderPipeline();
}

// ============================================================
// 会計タブ
// ============================================================
function renderAccounting() {
  const sheets = allData.sheets || {};
  let html = '';

  // PL月次推移
  html += '<div class="card">';
  html += '<div class="card-title">PL月次推移（実績 vs 予算）</div>';
  html += renderPLComparison(sheets.PL_actual, sheets.PL_budget);
  html += '</div>';

  // CF推移
  html += '<div class="card">';
  html += '<div class="card-title">CF推移・バーンレート・ランウェイ</div>';
  html += renderCFChart(sheets.CF);
  html += '</div>';

  // 直接雇用PL
  html += '<div class="card">';
  html += '<div class="card-title">直接雇用部門PL月次推移</div>';
  html += renderSegmentPLChart(sheets.PL_direct);
  html += '</div>';

  // 派遣PL
  html += '<div class="card">';
  html += '<div class="card-title">派遣部門PL月次推移</div>';
  html += renderSegmentPLChart(sheets.PL_dispatch);
  html += '</div>';

  document.getElementById('accounting-content').innerHTML = html;

  // Initialize charts
  setTimeout(() => {
    initPLComparisonChart(sheets.PL_actual, sheets.PL_budget);
    initCFChart(sheets.CF);
    if (sheets.PL_direct) initSegmentPLChart(sheets.PL_direct, 'direct-pl-chart');
    if (sheets.PL_dispatch) initSegmentPLChart(sheets.PL_dispatch, 'dispatch-pl-chart');
  }, 100);
}

function renderPLComparison(actual, budget) {
  if (!actual || actual.error) return '<div class="error">実績データが見つかりません</div>';
  if (!budget || budget.error) return '<div class="error">予算データが見つかりません</div>';

  const months = actual.months || [];
  let html = '<div class="chart-container"><canvas id="pl-comparison-chart"></canvas></div>';
  html += '<div class="table-container"><table><thead><tr><th>項目</th>';
  for (let m of months) html += `<th>${m}</th>`;
  html += '</tr></thead><tbody>';

  const actualRows = actual.rows || [];
  const budgetRows = budget.rows || [];

  for (let row of actualRows) {
    html += `<tr><td>${row.item}（実績）</td>`;
    for (let val of (row.values || [])) html += `<td>${formatNum(val)}</td>`;
    html += '</tr>';
  }

  for (let row of budgetRows) {
    html += `<tr><td>${row.item}（予算）</td>`;
    for (let val of (row.values || [])) html += `<td>${formatNum(val)}</td>`;
    html += '</tr>';
  }

  html += '</tbody></table></div>';
  return html;
}

function initPLComparisonChart(actual, budget) {
  const ctx = document.getElementById('pl-comparison-chart');
  if (!ctx || chartInstances['pl-comparison']) return;

  const months = actual.months || [];
  const actualSales = (actual.rows?.find(r => r.item === '売上高合計') || {}).values || [];
  const budgetSales = (budget.rows?.find(r => r.item === '売上高合計') || {}).values || [];

  chartInstances['pl-comparison'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: months,
      datasets: [
        {
          label: '売上高（実績）',
          data: actualSales,
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.1)',
          tension: 0.4,
          fill: true
        },
        {
          label: '売上高（予算）',
          data: budgetSales,
          borderColor: '#dc2626',
          backgroundColor: 'rgba(220, 38, 38, 0.1)',
          borderDash: [5, 5],
          tension: 0.4,
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => formatNum(v) } }
      }
    }
  });
}

function renderCFChart(cfData) {
  if (!cfData || cfData.error) return '<div class="error">CFデータが見つかりません</div>';

  const months = cfData.months || [];
  let html = '<div class="chart-container"><canvas id="cf-chart"></canvas></div>';
  html += '<div class="table-container"><table><thead><tr><th>項目</th>';
  for (let m of months) html += `<th>${m}</th>`;
  html += '</tr></thead><tbody>';

  for (let row of (cfData.rows || [])) {
    html += `<tr><td>${row.item}</td>`;
    for (let val of (row.values || [])) html += `<td>${formatNum(val)}</td>`;
    html += '</tr>';
  }

  html += '</tbody></table></div>';
  return html;
}

function initCFChart(cfData) {
  const ctx = document.getElementById('cf-chart');
  if (!ctx || chartInstances['cf']) return;

  const months = cfData.months || [];
  const cashBalance = (cfData.rows?.find(r => r.item === '現預金残高') || {}).values || [];

  chartInstances['cf'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        label: '現預金残高',
        data: cashBalance,
        borderColor: '#16a34a',
        backgroundColor: 'rgba(22, 163, 74, 0.1)',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: {
        y: { ticks: { callback: v => formatNum(v) } }
      }
    }
  });
}

function renderSegmentPLChart(segmentData) {
  if (!segmentData || segmentData.error) return '<div class="error">セグメントデータが見つかりません</div>';

  const sheetName = segmentData.sheetName || '不明';
  const chartId = sheetName.includes('直接') ? 'direct-pl-chart' : 'dispatch-pl-chart';

  const months = segmentData.months || [];
  let html = `<div class="chart-container"><canvas id="${chartId}"></canvas></div>`;
  html += '<div class="table-container"><table><thead><tr><th>項目</th>';
  for (let m of months) html += `<th>${m}</th>`;
  html += '</tr></thead><tbody>';

  for (let row of (segmentData.rows || [])) {
    html += `<tr><td>${row.item}</td>`;
    for (let val of (row.values || [])) html += `<td>${formatNum(val)}</td>`;
    html += '</tr>';
  }

  html += '</tbody></table></div>';
  return html;
}

function initSegmentPLChart(segmentData, chartId) {
  const ctx = document.getElementById(chartId);
  if (!ctx || chartInstances[chartId]) return;

  const months = segmentData.months || [];
  const salesRow = segmentData.rows?.find(r => r.item === '売上高合計') || {};
  const profitRow = segmentData.rows?.find(r => r.item === '営業利益') || {};

  chartInstances[chartId] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: months,
      datasets: [
        {
          label: '売上高合計',
          data: salesRow.values || [],
          backgroundColor: '#3b82f6',
          yAxisID: 'y'
        },
        {
          label: '営業利益',
          data: profitRow.values || [],
          backgroundColor: '#10b981',
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => formatNum(v) } },
        y1: { position: 'right', ticks: { callback: v => formatNum(v) } }
      }
    }
  });
}

// ============================================================
// 事業指標タブ
// ============================================================
function renderIndicators() {
  const sheets = allData.sheets || {};
  let html = '';

  // 業種別支援人数
  html += '<div class="card">';
  html += '<div class="card-title">業種別支援人数月次推移</div>';
  html += renderGenreChart(sheets.genre_support, 'genre-support-chart');
  html += '</div>';

  // 業種別紹介人数
  html += '<div class="card">';
  html += '<div class="card-title">業種別紹介人数月次推移</div>';
  html += renderGenreChart(sheets.genre_intro, 'genre-intro-chart');
  html += '</div>';

  // 派遣重要変数
  html += '<div class="card">';
  html += '<div class="card-title">派遣重要変数月次推移</div>';
  html += renderDispatchVariables(sheets.dispatch_variables);
  html += '</div>';

  document.getElementById('indicators-content').innerHTML = html;

  setTimeout(() => {
    initGenreChart(sheets.genre_support, 'genre-support-chart');
    initGenreChart(sheets.genre_intro, 'genre-intro-chart');
    initDispatchVariablesChart(sheets.dispatch_variables);
  }, 100);
}

function renderGenreChart(data, chartId) {
  if (!data || data.error) return '<div class="error">データが見つかりません</div>';

  const months = data.months || [];
  let html = `<div class="chart-container"><canvas id="${chartId}"></canvas></div>`;
  html += '<div class="table-container"><table><thead><tr><th>業種</th>';
  for (let m of months) html += `<th>${m}</th>`;
  html += '</tr></thead><tbody>';

  for (let row of (data.rows || [])) {
    html += `<tr><td>${row.genre || row.item || '不明'}</td>`;
    for (let val of (row.values || [])) html += `<td>${formatNum(val)}</td>`;
    html += '</tr>';
  }

  html += '</tbody></table></div>';
  return html;
}

function initGenreChart(data, chartId) {
  const ctx = document.getElementById(chartId);
  if (!ctx || chartInstances[chartId]) return;

  const months = data.months || [];
  const rows = data.rows || [];

  const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#06b6d4', '#84cc16', '#a855f7'];

  const datasets = rows.slice(0, 12).map((row, idx) => ({
    label: row.genre || row.item || `項目${idx + 1}`,
    data: row.values || [],
    borderColor: colors[idx % colors.length],
    backgroundColor: colors[idx % colors.length],
    borderWidth: 2,
    fill: false,
    tension: 0.4
  }));

  chartInstances[chartId] = new Chart(ctx, {
    type: 'line',
    data: { labels: months, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => formatNum(v) } } }
    }
  });
}

function renderDispatchVariables(data) {
  if (!data || data.error) return '<div class="error">派遣変数データが見つかりません</div>';

  const months = data.months || [];
  let html = '<div class="chart-container"><canvas id="dispatch-variables-chart"></canvas></div>';
  html += '<div class="table-container"><table><thead><tr><th>項目</th>';
  for (let m of months) html += `<th>${m}</th>`;
  html += '</tr></thead><tbody>';

  for (let row of (data.rows || [])) {
    html += `<tr><td>${row.item}</td>`;
    for (let val of (row.values || [])) html += `<td>${formatNum(val)}</td>`;
    html += '</tr>';
  }

  html += '</tbody></table></div>';
  return html;
}

function initDispatchVariablesChart(data) {
  const ctx = document.getElementById('dispatch-variables-chart');
  if (!ctx || chartInstances['dispatch-variables']) return;

  const months = data.months || [];
  const timeRow = data.rows?.find(r => r.item === '総時間') || {};
  const peopleRow = data.rows?.find(r => r.item === '総人数') || {};

  chartInstances['dispatch-variables'] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: months,
      datasets: [
        {
          label: '総時間',
          data: timeRow.values || [],
          backgroundColor: '#3b82f6',
          yAxisID: 'y'
        },
        {
          label: '総人数',
          data: peopleRow.values || [],
          backgroundColor: '#10b981',
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: {
        y: { ticks: { callback: v => formatNum(v) } },
        y1: { position: 'right', ticks: { callback: v => formatNum(v) } }
      }
    }
  });
}

// ============================================================
// 昨対比タブ
// ============================================================
function renderComparison() {
  const sheets = allData.sheets || {};
  let html = '';

  // 業種別支援人数昨対比
  html += '<div class="card">';
  html += '<div class="card-title">業種別支援人数昨対比</div>';
  html += renderYoYChart(sheets.genre_support, sheets.yoy_comparison, 'support', 'yoy-support-chart');
  html += '</div>';

  // 業種別紹介人数昨対比
  html += '<div class="card">';
  html += '<div class="card-title">業種別紹介人数昨対比</div>';
  html += renderYoYChart(sheets.genre_intro, sheets.yoy_comparison, 'intro', 'yoy-intro-chart');
  html += '</div>';

  // 派遣人数昨対比
  html += '<div class="card">';
  html += '<div class="card-title">派遣人数昨対比</div>';
  html += renderDispatchYoYChart(sheets.yoy_comparison, 'dispatch_people', 'yoy-dispatch-people-chart');
  html += '</div>';

  // 派遣総時間昨対比
  html += '<div class="card">';
  html += '<div class="card-title">派遣総時間昨対比</div>';
  html += renderDispatchYoYChart(sheets.yoy_comparison, 'dispatch_hours', 'yoy-dispatch-hours-chart');
  html += '</div>';

  document.getElementById('comparison-content').innerHTML = html;

  setTimeout(() => {
    initYoYChart(sheets.genre_support, sheets.yoy_comparison, 'support', 'yoy-support-chart');
    initYoYChart(sheets.genre_intro, sheets.yoy_comparison, 'intro', 'yoy-intro-chart');
    initDispatchYoYChart(sheets.yoy_comparison, 'dispatch_people', 'yoy-dispatch-people-chart');
    initDispatchYoYChart(sheets.yoy_comparison, 'dispatch_hours', 'yoy-dispatch-hours-chart');
  }, 100);
}

function renderYoYChart(currentData, yoyData, key, chartId) {
  if (!currentData || currentData.error) return '<div class="error">当年データが見つかりません</div>';
  if (!yoyData || yoyData.error) return '<div class="error">前年データが見つかりません</div>';

  const months = currentData.months || [];
  let html = `<div class="chart-container"><canvas id="${chartId}"></canvas></div>`;
  html += '<div class="table-container"><table><thead><tr><th>業種</th>';
  for (let m of months) html += `<th>${m}</th>`;
  html += '</tr></thead><tbody>';

  for (let row of (currentData.rows || [])) {
    html += `<tr><td>${row.genre || '不明'}（当年）</td>`;
    for (let val of (row.values || [])) html += `<td>${formatNum(val)}</td>`;
    html += '</tr>';
  }

  html += '</tbody></table></div>';
  return html;
}

function initYoYChart(currentData, yoyData, key, chartId) {
  // プレースホルダー実装 - 後から完成
  console.log('YoY chart placeholder:', chartId);
}

function renderDispatchYoYChart(yoyData, key, chartId) {
  if (!yoyData || yoyData.error) return '<div class="error">データが見つかりません</div>';

  const months = yoyData.months || [];
  const prevYear = yoyData.previousYear?.[key] || [];

  let html = `<div class="chart-container"><canvas id="${chartId}"></canvas></div>`;
  html += '<div class="table-container"><table><thead><tr><th>区分</th>';
  for (let m of months) html += `<th>${m}</th>`;
  html += '</tr></thead><tbody>';
  html += '<tr><td>前年</td>';
  for (let val of prevYear) html += `<td>${formatNum(val)}</td>`;
  html += '</tr></tbody></table></div>';

  return html;
}

function initDispatchYoYChart(yoyData, key, chartId) {
  // プレースホルダー実装 - 後から完成
  console.log('Dispatch YoY chart placeholder:', chartId);
}

// ============================================================
// パイプラインタブ
// ============================================================
function renderPipeline() {
  let html = '<div class="card"><div class="text-center text-gray-500 py-8">パイプラインデータは追って実装予定</div></div>';
  document.getElementById('pipeline-content').innerHTML = html;
}

// ============================================================
// UTILITIES
// ============================================================
function formatNum(v) {
  if (!v && v !== 0) return '-';
  if (typeof v !== 'number') v = parseFloat(v);
  if (isNaN(v)) return '-';
  if (v >= 1000000) return (v / 1000000).toFixed(1) + 'M';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'K';
  return v.toFixed(0);
}

// Initialize on load
window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
