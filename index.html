<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>経営ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .card { background: white; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .kpi-card { transition: box-shadow .15s; }
    .kpi-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .tab-btn { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: all .15s; }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-btn:not(.active) { color: #4b5563; }
    .tab-btn:not(.active):hover { background: #f3f4f6; }
    .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
    .badge-up   { background: #d1fae5; color: #065f46; }
    .badge-down { background: #fee2e2; color: #991b1b; }
    .badge-neutral { background: #f3f4f6; color: #6b7280; }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9ca3af; margin-bottom: 12px; }
    .data-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid; }
    .waterfall-bar { transition: width .4s ease; }
    table thead th { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .04em; padding: 10px 16px; }
    table tbody td { font-size: 13px; padding: 10px 16px; border-top: 1px solid #f3f4f6; }
    table tbody tr:hover { background: #f9fafb; }
    .negative { color: #dc2626; }
    .positive { color: #059669; }
    .pl-subtotal td { font-weight: 700 !important; background: #f8fafc; border-top: 2px solid #e2e8f0 !important; }
    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ===== HEADER ===== -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-screen-xl mx-auto px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-base font-bold text-gray-900">経営ダッシュボード</span>
      <span id="last-updated" class="text-xs text-gray-400"></span>
    </div>
    <div class="flex items-center gap-2">
      <span id="chip-sheets" class="data-chip border-gray-200 text-gray-400">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>
        Google Sheets 未接続
      </span>
      <span class="data-chip border-gray-200 text-gray-400">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
        Notion
      </span>
      <span class="data-chip border-gray-200 text-gray-400">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
        HubSpot
      </span>
      <button onclick="refreshAll()" class="flex items-center gap-1.5 text-sm font-medium text-blue-600 hover:text-blue-800 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-colors ml-1">
        <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        更新
      </button>
    </div>
  </div>
</header>

<main class="max-w-screen-xl mx-auto px-6 py-6 space-y-6">

  <!-- 期間 -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-sm font-medium text-gray-600">表示期間:</span>
      <div class="flex gap-1 bg-white border border-gray-200 rounded-lg p-1">
        <button class="tab-btn active" onclick="setPeriod('all', this)">全期間</button>
        <button class="tab-btn" onclick="setPeriod('h2', this)">後半6ヶ月</button>
        <button class="tab-btn" onclick="setPeriod('h1', this)">前半6ヶ月</button>
      </div>
      <span class="text-xs text-gray-400" id="period-label"></span>
    </div>
    <div id="fy-label" class="text-xs font-semibold text-gray-400 bg-gray-100 px-3 py-1 rounded-full"></div>
  </div>

  <!-- ===== KPI サマリカード ===== -->
  <section>
    <div class="section-title">P&L サマリ（直近月）</div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4" id="kpi-cards"></div>
  </section>

  <!-- ===== 累計カード ===== -->
  <section>
    <div class="section-title">累計（表示期間合計）</div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" id="cumulative-cards"></div>
  </section>

  <!-- ===== チャートエリア ===== -->
  <div class="grid lg:grid-cols-3 gap-5">

    <!-- 月次P&L推移 (2/3) -->
    <div class="card lg:col-span-2 p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-gray-800 text-sm">月次P&L推移</h3>
        <div class="flex gap-1" id="chart-toggles"></div>
      </div>
      <canvas id="pl-chart" height="190"></canvas>
    </div>

    <!-- 費用構造 (1/3) -->
    <div class="card p-5">
      <h3 class="font-semibold text-gray-800 text-sm mb-4">費用構造（月次）</h3>
      <canvas id="cost-chart" height="230"></canvas>
    </div>
  </div>

  <!-- 利益率トレンド -->
  <div class="card p-5">
    <h3 class="font-semibold text-gray-800 text-sm mb-4">利益率推移（%）</h3>
    <canvas id="margin-chart" height="100"></canvas>
  </div>

  <!-- ===== 部門別売上 ===== -->
  <div class="card p-5">
    <h3 class="font-semibold text-gray-800 text-sm mb-4">部門別売上構成</h3>
    <canvas id="dept-chart" height="110"></canvas>
  </div>

  <!-- ===== P&L 明細テーブル ===== -->
  <div class="card overflow-hidden">
    <div class="flex items-center justify-between px-5 pt-4 pb-2">
      <h3 class="font-semibold text-gray-800 text-sm">月次P&L明細</h3>
      <span class="text-xs text-gray-400">単位: 万円（円÷10,000、四捨五入）</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full" id="pl-table"></table>
    </div>
  </div>

  <!-- ===== 未連携プレースホルダー ===== -->
  <div class="grid md:grid-cols-2 gap-4">
    <div class="card p-5 border-2 border-dashed border-gray-200 flex flex-col items-center gap-3 text-center min-h-[130px] justify-center">
      <p class="text-sm font-medium text-gray-400">Notion KPI 連携待ち</p>
      <p class="text-xs text-gray-400">APIキー + データベースIDを設定</p>
      <button class="text-xs text-blue-600 hover:underline font-medium">設定する →</button>
    </div>
    <div class="card p-5 border-2 border-dashed border-gray-200 flex flex-col items-center gap-3 text-center min-h-[130px] justify-center">
      <p class="text-sm font-medium text-gray-400">HubSpot パイプライン 連携待ち</p>
      <p class="text-xs text-gray-400">APIキーを設定してセールスデータを表示</p>
      <button class="text-xs text-blue-600 hover:underline font-medium">設定する →</button>
    </div>
  </div>

</main>

<!-- ===== SCRIPT ===== -->
<script>
// ================================================================
// CONFIG
// ================================================================
const CONFIG = {
  gasUrl: "https://script.google.com/macros/s/AKfycbx73SsEJ9zLJFkai2CSuEMx6JUxUaD0TWAjnbvBHZcs60duT6QQQckcZA69PNbJiAij/exec",
  fyStartMonth: 11,
};

// ================================================================
// REAL DATA (PDFから抽出 — GAS接続後は自動上書き)
// ================================================================
// 月ラベル: FY11月〜10月
const MONTHS = ["2024-11","2024-12","2025-01","2025-02","2025-03",
                "2025-04","2025-05","2025-06","2025-07","2025-08","2025-09","2025-10"];

// 単位: 円 → 表示時に万円変換
let DATA = {
  months: MONTHS,
  summary: {
    revenue:     [65483104,53740806,47609562,45824062,44501004,55997398,55601260,63001044,72829700,86666500,83687000,83510250],
    cogs:        [36830526,28837862,24300609,22305105,24370738,31193745,30524891,32152065,44646086,51748236,51716101,51433318],
    grossProfit: [28652578,24902944,23308953,23518957,20130266,24803653,25076370,30848979,28183614,34918264,31970899,32076932],
    personnel:   [18699790,17642337,16829944,17140669,17629874,18150018,17606337,16644199,16940319,17325405,17075405,17075405],
    sgaTotal:    [38458701,37783884,35022345,33465426,40656035,31980343,29921098,29524960,37541080,28306166,28206166,28406166],
    opProfit:    [-9806123,-12880940,-11713392,-9946469,-20525769,-7176690,-4844728,1324019,-9357466,6612097,3764733,3670766],
    ordProfit:   [-9879507,-13084252,-11893379,-10011792,-19413495,-7298740,-5144728,1024019,-9657466,6312097,3464733,3370766],
    netProfit:   [-9879507,-13084252,-11893379,-9993753,-19411686,-7298740,-5144728,1024019,-9657466,6312097,3464733,3370766],
  },
  revenueByDept: {
    "直接雇用(営業部門)": [8400000,8196000,6612000,4776000,3696000,7170000,1940000,2400000,0,0,0,0],
    "直接雇用(CS部門A)":  [15425800,11804234,12048400,9193000,8581903,8428402,9199404,10374800,9522000,9758000,10121000,10420000],
    "直接雇用(CS部門B)":  [4540000,9286400,2944990,3523405,7137754,3617800,5344716,2728584,3042500,3192500,3365000,3365000],
    "直接雇用(福岡部門)": [3680000,350000,2740000,1727200,126000,722400,192000,1209000,458000,494000,548000,890000],
    "派遣":               [33493629,22186850,20846028,19498025,23441369,33671221,37225140,44273620,59355200,73230000,69570000,69085250],
    "その他":             [0,0,0,0,0,0,700000,1015040,452000,0,83000,0],
  },
};

// ================================================================
// STATE
// ================================================================
let currentPeriod = "all";
let charts = {};
const SERIES_VISIBLE = { revenue: true, grossProfit: true, opProfit: true, netProfit: false };

// ================================================================
// UTILS
// ================================================================
const toMan = (v) => v == null ? null : Math.round(v / 10000);
const fmtMan = (v) => v == null ? "—" : v.toLocaleString("ja-JP");
const pct = (num, den) => den && den !== 0 ? (num / den * 100).toFixed(1) + "%" : "—";
const pctNum = (num, den) => den && den !== 0 ? num / den * 100 : null;
const sign = (v) => v > 0 ? "+" : "";

function getIndices() {
  const n = DATA.months.length;
  if (currentPeriod === "h1") return Array.from({length: Math.ceil(n/2)}, (_, i) => i);
  if (currentPeriod === "h2") return Array.from({length: Math.floor(n/2)}, (_, i) => Math.ceil(n/2) + i);
  return Array.from({length: n}, (_, i) => i);
}

function monthLabel(m) {
  // "2024-11" → "11月", "2025-01" → "1月"
  if (m.match(/^\d{4}-\d{2}$/)) return parseInt(m.split("-")[1]) + "月";
  return m;
}

function badgeMoM(cur, prev) {
  if (prev == null || prev === 0) return "";
  const r = (cur - prev) / Math.abs(prev);
  const cls = r >= 0 ? "badge-up" : "badge-down";
  const arrow = r >= 0 ? "↑" : "↓";
  return `<span class="badge ${cls}">${arrow} ${Math.abs(r*100).toFixed(1)}%</span>`;
}

// ================================================================
// KPI CARDS
// ================================================================
function renderKpiCards(indices) {
  const last = indices[indices.length - 1];
  const prev = last > 0 ? last - 1 : null;
  const s = DATA.summary;
  const lastLabel = monthLabel(DATA.months[last]);

  const cards = [
    { label: "売上高",    key: "revenue",     color: "#3b82f6", icon: "💰" },
    { label: "売上総利益", key: "grossProfit", color: "#10b981", icon: "📈" },
    { label: "営業利益",  key: "opProfit",    color: "#8b5cf6", icon: "⚡" },
    { label: "当期純利益", key: "netProfit",  color: "#f59e0b", icon: "🏁" },
  ];

  document.getElementById("kpi-cards").innerHTML = cards.map(c => {
    const val  = toMan(s[c.key][last]);
    const pval = prev !== null ? toMan(s[c.key][prev]) : null;
    const isNeg = val < 0;
    const gp = c.key === "grossProfit" ? pct(s.grossProfit[last], s.revenue[last]) : null;
    const op = c.key === "opProfit"    ? pct(s.opProfit[last],    s.revenue[last]) : null;
    const np = c.key === "netProfit"   ? pct(s.netProfit[last],   s.revenue[last]) : null;
    const marginPct = gp || op || np;
    return `
    <div class="card kpi-card p-5">
      <div class="flex items-start justify-between mb-2">
        <span class="text-xs font-medium text-gray-500">${c.label} <span class="text-gray-300">|</span> ${lastLabel}</span>
        <span class="text-lg">${c.icon}</span>
      </div>
      <div class="text-2xl font-bold ${isNeg ? "text-red-600" : "text-gray-900"} mb-2">
        ${isNeg ? "▲" : ""}${fmtMan(Math.abs(val))}<span class="text-sm font-normal text-gray-400 ml-1">万円</span>
      </div>
      <div class="flex flex-wrap gap-1.5 items-center">
        ${pval !== null ? badgeMoM(val, pval) : ""}
        ${marginPct ? `<span class="badge badge-neutral">利益率 ${marginPct}</span>` : ""}
      </div>
    </div>`;
  }).join("");
}

// ================================================================
// CUMULATIVE CARDS
// ================================================================
function renderCumulativeCards(indices) {
  const s = DATA.summary;
  const keys = [
    { label: "累計売上",    key: "revenue",     color: "text-blue-700"  },
    { label: "累計粗利",    key: "grossProfit", color: "text-emerald-700" },
    { label: "累計営業利益", key: "opProfit",   color: "text-violet-700" },
    { label: "累計純利益",  key: "netProfit",   color: "text-amber-700"  },
  ];

  document.getElementById("cumulative-cards").innerHTML = keys.map(c => {
    const total = indices.reduce((acc, i) => acc + (s[c.key][i] || 0), 0);
    const totalMan = toMan(total);
    const isNeg = totalMan < 0;
    const revTotal = indices.reduce((acc, i) => acc + (s.revenue[i] || 0), 0);
    const marginStr = c.key !== "revenue" ? pct(total, revTotal) : null;
    return `
    <div class="card p-4 border-l-4" style="border-left-color: ${isNeg ? '#dc2626' : '#10b981'}">
      <div class="text-xs text-gray-500 mb-1">${c.label}</div>
      <div class="text-xl font-bold ${isNeg ? "text-red-600" : c.color}">
        ${isNeg ? "▲" : ""}${fmtMan(Math.abs(totalMan))}<span class="text-xs font-normal text-gray-400 ml-1">万円</span>
      </div>
      ${marginStr ? `<div class="text-xs text-gray-400 mt-1">利益率 ${marginStr}</div>` : ""}
    </div>`;
  }).join("");
}

// ================================================================
// P&L TREND CHART
// ================================================================
const SERIES_CONFIG = [
  { key: "revenue",     label: "売上高",    color: "#3b82f6", fill: false },
  { key: "grossProfit", label: "売上総利益", color: "#10b981", fill: false },
  { key: "opProfit",    label: "営業利益",  color: "#8b5cf6", fill: false },
  { key: "netProfit",   label: "当期純利益", color: "#f59e0b", fill: false },
];

function renderChartToggles() {
  document.getElementById("chart-toggles").innerHTML = SERIES_CONFIG.map(s => {
    const on = SERIES_VISIBLE[s.key];
    return `<button
      onclick="toggleSeries('${s.key}', this)"
      style="${on ? `background:${s.color};color:white;border-color:${s.color}` : `background:white;color:#6b7280;border-color:#e5e7eb`}"
      class="text-xs px-2.5 py-1 rounded-md border font-medium transition-all"
    >${s.label}</button>`;
  }).join("");
}

function renderPlChart(indices) {
  const labels = indices.map(i => monthLabel(DATA.months[i]));
  const datasets = SERIES_CONFIG.map(s => ({
    label: s.label,
    data: indices.map(i => toMan(DATA.summary[s.key][i])),
    borderColor: s.color,
    backgroundColor: s.color + "18",
    borderWidth: 2,
    pointRadius: 3,
    tension: 0.3,
    hidden: !SERIES_VISIBLE[s.key],
    fill: s.fill,
  }));

  if (charts.pl) charts.pl.destroy();
  charts.pl = new Chart(document.getElementById("pl-chart"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              return ` ${ctx.dataset.label}: ${v < 0 ? "▲" : ""}${Math.abs(v).toLocaleString()} 万円`;
            },
          },
        },
      },
      scales: {
        y: {
          grid: { color: "#f3f4f6" },
          ticks: {
            font: { size: 11 },
            callback: v => (v < 0 ? "▲" : "") + Math.abs(v/100).toFixed(0) + "百万",
          },
        },
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
      },
    },
  });
}

function toggleSeries(key, btn) {
  SERIES_VISIBLE[key] = !SERIES_VISIBLE[key];
  const cfg = SERIES_CONFIG.find(s => s.key === key);
  if (SERIES_VISIBLE[key]) {
    btn.style.background = cfg.color;
    btn.style.color = "white";
    btn.style.borderColor = cfg.color;
  } else {
    btn.style.background = "white";
    btn.style.color = "#6b7280";
    btn.style.borderColor = "#e5e7eb";
  }
  if (charts.pl) {
    const ds = charts.pl.data.datasets.find(d => d.label === cfg.label);
    if (ds) { ds.hidden = !SERIES_VISIBLE[key]; charts.pl.update(); }
  }
}

// ================================================================
// COST STRUCTURE CHART
// ================================================================
function renderCostChart(indices) {
  const labels = indices.map(i => monthLabel(DATA.months[i]));
  const s = DATA.summary;
  const datasets = [
    {
      label: "売上原価",
      data: indices.map(i => toMan(s.cogs[i])),
      backgroundColor: "#f87171",
    },
    {
      label: "人件費",
      data: indices.map(i => toMan(s.personnel[i])),
      backgroundColor: "#fb923c",
    },
    {
      label: "その他販管費",
      data: indices.map(i => toMan(s.sgaTotal[i] - s.personnel[i])),
      backgroundColor: "#fbbf24",
    },
  ];

  if (charts.cost) charts.cost.destroy();
  charts.cost = new Chart(document.getElementById("cost-chart"), {
    type: "bar",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 10 }, boxWidth: 10, padding: 8 } },
        tooltip: {
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()} 万円` },
        },
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 } } },
        y: { stacked: true, grid: { color: "#f3f4f6" }, ticks: { font: { size: 10 }, callback: v => v/100 + "百万" } },
      },
    },
  });
}

// ================================================================
// MARGIN CHART
// ================================================================
function renderMarginChart(indices) {
  const labels = indices.map(i => monthLabel(DATA.months[i]));
  const s = DATA.summary;
  const datasets = [
    {
      label: "粗利率",
      data: indices.map(i => pctNum(s.grossProfit[i], s.revenue[i])),
      borderColor: "#10b981", backgroundColor: "#10b98118",
      borderWidth: 2, tension: 0.3, fill: true, pointRadius: 3,
    },
    {
      label: "営業利益率",
      data: indices.map(i => pctNum(s.opProfit[i], s.revenue[i])),
      borderColor: "#8b5cf6", backgroundColor: "#8b5cf618",
      borderWidth: 2, tension: 0.3, fill: true, pointRadius: 3,
    },
  ];

  if (charts.margin) charts.margin.destroy();
  charts.margin = new Chart(document.getElementById("margin-chart"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "right", labels: { font: { size: 11 }, boxWidth: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              return ` ${ctx.dataset.label}: ${v < 0 ? "▲" : ""}${Math.abs(v).toFixed(1)}%`;
            },
          },
        },
      },
      scales: {
        y: {
          grid: { color: "#f3f4f6" },
          ticks: { font: { size: 11 }, callback: v => (v < 0 ? "▲" : "") + Math.abs(v).toFixed(0) + "%" },
        },
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
      },
    },
  });
}

// ================================================================
// DEPT CHART
// ================================================================
function renderDeptChart(indices) {
  const labels = indices.map(i => monthLabel(DATA.months[i]));
  const deptColors = ["#3b82f6","#10b981","#8b5cf6","#f59e0b","#ef4444","#06b6d4","#84cc16"];
  const datasets = Object.entries(DATA.revenueByDept).map(([dept, vals], idx) => ({
    label: dept,
    data: indices.map(i => toMan(vals[i])),
    backgroundColor: deptColors[idx % deptColors.length],
  }));

  if (charts.dept) charts.dept.destroy();
  charts.dept = new Chart(document.getElementById("dept-chart"), {
    type: "bar",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 10 }, boxWidth: 10, padding: 8 } },
        tooltip: {
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()} 万円` },
        },
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { stacked: true, grid: { color: "#f3f4f6" }, ticks: { font: { size: 10 }, callback: v => v/100 + "百万" } },
      },
    },
  });
}

// ================================================================
// TABLE
// ================================================================
function renderTable(indices) {
  const s = DATA.summary;
  const mLabels = indices.map(i => monthLabel(DATA.months[i]));

  const rows = [
    { label: "売上高",              key: "revenue",     bold: true, sign: 1 },
    { label: "売上原価",            key: "cogs",        indent: 1,  sign: -1 },
    { label: "売上総利益",          key: "grossProfit", bold: true, subtotal: true, sign: 1 },
    { label: "販売費及び一般管理費", key: "sgaTotal",   indent: 1,  sign: -1 },
    { label: "うち 人件費",         key: "personnel",   indent: 2,  sign: -1, sub: true },
    { label: "営業利益",            key: "opProfit",    bold: true, subtotal: true, sign: 1 },
    { label: "経常利益",            key: "ordProfit",   bold: true, subtotal: true, sign: 1 },
    { label: "当期純利益",          key: "netProfit",   bold: true, subtotal: true, sign: 1 },
  ];

  const th = `<thead class="bg-gray-50 border-b border-gray-200"><tr>
    <th class="text-left sticky left-0 bg-gray-50" style="min-width:180px">項目</th>
    ${mLabels.map(m => `<th class="text-right">${m}</th>`).join("")}
    <th class="text-right bg-blue-50" style="min-width:80px">累計</th>
  </tr></thead>`;

  const tbody = "<tbody>" + rows.map(row => {
    const vals = indices.map(i => s[row.key] ? s[row.key][i] : null);
    const total = vals.reduce((a, b) => a + (b || 0), 0);
    const totalMan = toMan(total);
    const rowClass = row.subtotal ? "pl-subtotal" : "";
    const labelPad = row.indent === 2 ? "pl-12" : row.indent === 1 ? "pl-7" : "";
    const labelClass = `${labelPad} ${row.bold ? "font-semibold text-gray-800" : "text-gray-600"} ${row.sub ? "text-xs text-gray-400" : ""}`;

    return `<tr class="${rowClass}">
      <td class="${labelClass} sticky left-0 bg-white ${rowClass ? "bg-gray-50" : ""}">${row.label}</td>
      ${vals.map(v => {
        const man = toMan(v);
        const isNeg = man !== null && man < 0;
        return `<td class="text-right font-mono ${row.bold ? "font-semibold" : ""} ${isNeg ? "text-red-600" : "text-gray-800"}">
          ${man !== null ? (isNeg ? `(${fmtMan(Math.abs(man))})` : fmtMan(man)) : "—"}
        </td>`;
      }).join("")}
      <td class="text-right font-mono font-semibold bg-blue-50 ${totalMan < 0 ? "text-red-600" : "text-gray-800"}">
        ${totalMan < 0 ? `(${fmtMan(Math.abs(totalMan))})` : fmtMan(totalMan)}
      </td>
    </tr>`;
  }).join("") + "</tbody>";

  document.getElementById("pl-table").innerHTML = th + tbody;
}

// ================================================================
// PERIOD SELECT
// ================================================================
function setPeriod(p, btn) {
  currentPeriod = p;
  document.querySelectorAll(".tab-btn").forEach(b => { b.classList.remove("active"); });
  btn.classList.add("active");
  render();
}

// ================================================================
// RENDER
// ================================================================
function render() {
  const indices = getIndices();
  renderKpiCards(indices);
  renderCumulativeCards(indices);
  renderChartToggles();
  renderPlChart(indices);
  renderCostChart(indices);
  renderMarginChart(indices);
  renderDeptChart(indices);
  renderTable(indices);

  const first = monthLabel(DATA.months[indices[0]]);
  const last  = monthLabel(DATA.months[indices[indices.length - 1]]);
  document.getElementById("period-label").textContent = `${first} 〜 ${last}`;
  document.getElementById("fy-label").textContent =
    `FY ${DATA.months[0].split("-")[0]}/${parseInt(DATA.months[0].split("-")[1])}〜${DATA.months[DATA.months.length-1].split("-")[0]}/${parseInt(DATA.months[DATA.months.length-1].split("-")[1])}`;
}

// ================================================================
// REFRESH (GAS接続後はリアルデータを取得)
// ================================================================
async function refreshAll() {
  const icon = document.getElementById("refresh-icon");
  icon.classList.add("spinning");
  document.getElementById("last-updated").textContent = "読み込み中...";

  if (CONFIG.gasUrl) {
    try {
      const res = await fetch(CONFIG.gasUrl);
      const json = await res.json();
      if (!json.error) {
        // GASから取得したデータでDATAを上書き
        DATA.months = json.months;
        DATA.summary = json.summary;
        DATA.revenueByDept = json.revenueByDept;

        // チップを接続済みに更新
        const chip = document.getElementById("chip-sheets");
        chip.className = "data-chip border-green-200 text-green-700 bg-green-50";
        chip.innerHTML = `<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg> Google Sheets`;
      }
    } catch (e) {
      console.error("GAS fetch error:", e);
    }
  }

  setTimeout(() => {
    render();
    document.getElementById("last-updated").textContent =
      `最終更新: ${new Date().toLocaleTimeString("ja-JP")}`;
    icon.classList.remove("spinning");
  }, 400);
}

// ================================================================
// INIT
// ================================================================
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("last-updated").textContent =
    `最終更新: ${new Date().toLocaleTimeString("ja-JP")} (デモデータ)`;
  render();
});
</script>
</body>
