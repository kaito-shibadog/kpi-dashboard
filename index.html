<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>経営ダッシュボード v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .tab-btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .tab-btn.active { background: #2563eb; color: white; }
    .tab-btn:not(.active) { color: #666; background: #f0f0f0; }
    .period-btn { padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .period-btn.active { background: #2563eb; color: white; }
    .period-btn:not(.active) { color: #666; background: #e5e7eb; }
    .card { background: white; border-radius: 8px; border: 1px solid #e5e7eb; padding: 16px; margin-bottom: 16px; }
    .chart-container { position: relative; height: 500px; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 16px; }
    th, td { border: 1px solid #e5e7eb; padding: 6px; text-align: right; }
    th { background: #f9fafb; font-weight: 600; }
    td:first-child, th:first-child { text-align: left; }
  </style>
</head>
<body class="bg-gray-50">

<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-gray-900">経営ダッシュボード (25年11月〜26年10月)</h1>
    <div class="text-xs text-gray-500" id="last-updated"></div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-6">

  <div class="flex gap-3 mb-6 border-b border-gray-200 pb-3">
    <button class="tab-btn active" onclick="switchTab('accounting', this)">会計</button>
    <button class="tab-btn" onclick="switchTab('indicators', this)">事業指標</button>
  </div>

  <div class="mb-6 flex gap-2 flex-wrap">
    <span class="text-sm font-medium text-gray-700 self-center">表示期間:</span>
    <button class="period-btn active" onclick="setPeriod('all', this)">全期間</button>
    <button class="period-btn" onclick="setPeriod('q1', this)">1Q</button>
    <button class="period-btn" onclick="setPeriod('q2', this)">2Q</button>
    <button class="period-btn" onclick="setPeriod('q3', this)">3Q</button>
    <button class="period-btn" onclick="setPeriod('q4', this)">4Q</button>
    <button class="period-btn" onclick="setPeriod('h1', this)">前半6ヶ月</button>
    <button class="period-btn" onclick="setPeriod('h2', this)">後半6ヶ月</button>
  </div>

  <div id="accounting-tab">
    <div id="accounting-content"></div>
  </div>

  <div id="indicators-tab" class="hidden">
    <div id="indicators-content"></div>
  </div>

</main>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwQuOms-1VzT11Gilbsbo93FAEekgoZkKS4NnHTzHwMisbh7v9Eq5r-o-aMN4Itbt4-ZA/exec';
let allData = {};
let currentPeriod = 'all';

async function init() {
  try {
    const response = await fetch(GAS_URL, { mode: 'cors' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    allData = data;

    if (data.updatedAt) {
      document.getElementById('last-updated').textContent =
        `最終更新: ${new Date(data.updatedAt).toLocaleString('ja-JP')}`;
    }

    renderAccounting();
  } catch (err) {
    document.getElementById('accounting-content').innerHTML =
      `<div class="text-red-600">エラー: ${err.message}</div>`;
  }
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('accounting-tab').classList.add('hidden');
  document.getElementById('indicators-tab').classList.add('hidden');

  if (tab === 'accounting') {
    document.getElementById('accounting-tab').classList.remove('hidden');
    renderAccounting();
  } else {
    document.getElementById('indicators-tab').classList.remove('hidden');
    renderIndicators();
  }
}

function setPeriod(period, btn) {
  currentPeriod = period;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (!document.getElementById('accounting-tab').classList.contains('hidden')) {
    renderAccounting();
  } else {
    renderIndicators();
  }
}

function renderAccounting() {
  const container = document.getElementById('accounting-content');
  container.innerHTML = '';
  renderPLChart(container);
}

function renderPLChart(container) {
  const actualSheet = allData.sheets?.['全社PL(見込+実績)'];
  const budgetSheet = allData.sheets?.['全社PL(予算)'];

  if (!actualSheet || !budgetSheet || !Array.isArray(actualSheet.data)) {
    container.innerHTML = '<div class="text-red-600">データが見つかりません</div>';
    return;
  }

  // グラフカード
  const chartCard = document.createElement('div');
  chartCard.className = 'card';

  const titleDiv = document.createElement('div');
  titleDiv.style.display = 'flex';
  titleDiv.style.justifyContent = 'space-between';
  titleDiv.style.alignItems = 'center';
  titleDiv.style.marginBottom = '16px';

  const titleH2 = document.createElement('h2');
  titleH2.className = 'text-lg font-semibold';
  titleH2.textContent = '全社PL推移（月次）';
  titleDiv.appendChild(titleH2);

  const checkboxLabel = document.createElement('label');
  checkboxLabel.style.display = 'flex';
  checkboxLabel.style.alignItems = 'center';
  checkboxLabel.style.gap = '6px';
  checkboxLabel.style.fontSize = '14px';
  checkboxLabel.style.cursor = 'pointer';

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.checked = true;
  checkbox.id = 'budget-toggle';
  checkbox.style.width = '18px';
  checkbox.style.height = '18px';
  checkbox.style.cursor = 'pointer';

  checkboxLabel.appendChild(checkbox);
  checkboxLabel.appendChild(document.createTextNode('予算を表示'));
  titleDiv.appendChild(checkboxLabel);

  chartCard.appendChild(titleDiv);

  const chartContainer = document.createElement('div');
  chartContainer.className = 'chart-container';
  chartContainer.id = 'pl-chart-container';
  chartCard.appendChild(chartContainer);

  container.appendChild(chartCard);

  // チェックボックスのイベント
  checkbox.addEventListener('change', () => {
    chartContainer.innerHTML = '';
    drawPLChart(chartContainer, actualSheet.data, budgetSheet.data, checkbox.checked);
  });

  // テーブルカード
  const tableCard = document.createElement('div');
  tableCard.className = 'card';
  tableCard.innerHTML = '<h2 class="text-lg font-semibold mb-4">全社PL明細</h2>';

  const table = document.createElement('table');
  table.className = 'w-full border-collapse text-xs';
  table.style.marginBottom = '0';

  // ヘッダー
  const headers = ['項目', '11月', '12月', '1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月'];
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  headerRow.style.borderBottom = '2px solid #d1d5db';
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    th.style.padding = '6px';
    th.style.fontWeight = '600';
    th.style.background = '#f9fafb';
    th.style.textAlign = h === '項目' ? 'left' : 'right';
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  // データ取得
  const actualRows = {};
  const budgetRows = {};

  actualSheet.data.forEach(row => {
    if (!row || !row[0]) return;
    const itemName = String(row[0]).trim();
    if (itemName === '売上高合計') actualRows['売上高'] = row;
    else if (itemName === '売上総利益') actualRows['売上総利益'] = row;
    else if (itemName === '営業利益') actualRows['営業利益'] = row;
  });

  budgetSheet.data.forEach(row => {
    if (!row || !row[0]) return;
    const itemName = String(row[0]).trim();
    if (itemName === '売上総利益') budgetRows['売上総利益'] = row;
    else if (itemName === '営業利益') budgetRows['営業利益'] = row;
  });

  const tbody = document.createElement('tbody');
  const items = ['売上高', '売上総利益', '営業利益'];

  items.forEach(item => {
    const actualRow = actualRows[item];
    if (!actualRow) return;

    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid #e5e7eb';

    const itemCell = document.createElement('td');
    itemCell.textContent = item;
    itemCell.style.padding = '6px';
    itemCell.style.textAlign = 'left';
    itemCell.style.fontWeight = '500';
    tr.appendChild(itemCell);

    for (let i = 2; i < 14; i++) {
      const td = document.createElement('td');
      const value = actualRow[i] || 0;
      td.textContent = (value / 10000).toLocaleString('ja-JP', {minimumFractionDigits: 0, maximumFractionDigits: 0});
      td.style.padding = '6px';
      td.style.textAlign = 'right';
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  tableCard.appendChild(table);
  container.appendChild(tableCard);

  setTimeout(() => {
    drawPLChart(chartContainer, actualSheet.data, budgetSheet.data);
  }, 100);

  // CF セクション
  renderCFChart(container);

  // 直接雇用事業PL
  renderBusinessPLChart(container, '直接雇用PL(見込+実績)', '直接雇用事業PL推移（月次）');

  // 派遣事業PL
  renderBusinessPLChart(container, '派遣PL(見込+実績)', '派遣事業PL推移（月次）');
}

function renderBusinessPLChart(container, sheetName, title) {
  const sheet = allData.sheets?.[sheetName];

  if (!sheet || !Array.isArray(sheet.data)) {
    return;
  }

  // グラフカード
  const chartCard = document.createElement('div');
  chartCard.className = 'card';
  chartCard.innerHTML = `<h2 class="text-lg font-semibold mb-4">${title}</h2>`;

  const chartContainer = document.createElement('div');
  chartContainer.className = 'chart-container';
  chartContainer.id = `pl-chart-${sheetName}`;
  chartCard.appendChild(chartContainer);

  container.appendChild(chartCard);

  // テーブルカード
  const tableCard = document.createElement('div');
  tableCard.className = 'card';
  tableCard.innerHTML = `<h2 class="text-lg font-semibold mb-4">${title.replace('推移', '')}明細</h2>`;

  const table = document.createElement('table');
  table.className = 'w-full border-collapse text-xs';
  table.style.marginBottom = '0';

  // ヘッダー
  const headers = ['項目', '11月', '12月', '1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月'];
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  headerRow.style.borderBottom = '2px solid #d1d5db';
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    th.style.padding = '6px';
    th.style.fontWeight = '600';
    th.style.background = '#f9fafb';
    th.style.textAlign = h === '項目' ? 'left' : 'right';
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  // データ抽出
  const actualRows = {};

  sheet.data.forEach(row => {
    if (!row || !row[0]) return;
    const itemName = String(row[0]).trim();
    if (itemName === '売上高合計') actualRows['売上高'] = row;
    else if (itemName === '売上総利益' || itemName === '売上総利益合計') actualRows['売上総利益'] = row;
    else if (itemName === '営業利益') actualRows['営業利益'] = row;
    else if (itemName === '営業利益(本社費用割賦後)') actualRows['営業利益(本社費用割賦後)'] = row;
  });

  const tbody = document.createElement('tbody');
  const items = ['売上高', '売上総利益', '営業利益', '営業利益(本社費用割賦後)'];

  items.forEach(item => {
    const actualRow = actualRows[item];
    if (!actualRow) return;

    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid #e5e7eb';

    const itemCell = document.createElement('td');
    itemCell.textContent = item;
    itemCell.style.padding = '6px';
    itemCell.style.textAlign = 'left';
    itemCell.style.fontWeight = '500';
    tr.appendChild(itemCell);

    for (let i = 2; i < 14; i++) {
      const td = document.createElement('td');
      const value = actualRow[i] || 0;
      td.textContent = (value / 10000).toLocaleString('ja-JP', {minimumFractionDigits: 0, maximumFractionDigits: 0});
      td.style.padding = '6px';
      td.style.textAlign = 'right';
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  tableCard.appendChild(table);
  container.appendChild(tableCard);

  setTimeout(() => {
    drawBusinessChart(chartContainer, sheet.data);
  }, 100);
}

function drawBusinessChart(container, actualData) {
  const canvas = document.createElement('canvas');
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const headers = actualData[0];
  const colStart = 2;
  const allLabels = headers.slice(colStart, colStart + 12).filter(h => h && h !== '合計' && !h.includes('その他'));

  // 期間に応じたデータ範囲を決定
  const [startIdx, endIdx] = getPeriodRange(allLabels.length);
  const labels = allLabels.slice(startIdx, endIdx + 1);
  const dataColStart = colStart + startIdx;
  const dataColEnd = colStart + endIdx + 1;

  const actualRows = {};
  actualData.forEach(row => {
    if (!row || !row[0]) return;
    const itemName = String(row[0]).trim();

    if (itemName === '売上高合計') {
      actualRows['売上高'] = row;
    } else if (itemName === '売上総利益' || itemName === '売上総利益合計') {
      actualRows['売上総利益'] = row;
    } else if (itemName === '営業利益') {
      actualRows['営業利益'] = row;
    } else if (itemName === '営業利益(本社費用割賦後)') {
      actualRows['営業利益(本社費用割賦後)'] = row;
    }
  });

  const datasets = [];
  const colors = {
    '売上高': '#3b82f6',
    '売上総利益': '#d97706',
    '営業利益': '#000000',
    '営業利益(本社費用割賦後)': '#7c3aed'
  };

  ['売上高', '売上総利益', '営業利益', '営業利益(本社費用割賦後)'].forEach(key => {
    if (actualRows[key]) {
      const values = actualRows[key].slice(dataColStart, dataColEnd)
        .map(v => typeof v === 'number' ? Math.round(v / 10000) : 0);

      datasets.push({
        label: key,
        data: values,
        borderColor: colors[key],
        backgroundColor: 'transparent',
        borderWidth: 2,
        tension: 0.4,
        fill: false,
        borderDash: []
      });
    }
  });

  new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          mode: 'index',
          intersect: false,
          backgroundColor: 'rgba(0, 0, 0, 0.8)',
          titleColor: '#fff',
          bodyColor: '#fff',
          borderColor: '#ccc',
          borderWidth: 1,
          padding: 12,
          displayColors: true,
          callbacks: {
            title: function(context) {
              return context[0].label;
            },
            label: function(context) {
              const value = context.parsed.y;
              return context.dataset.label + ': ' + value.toLocaleString() + '万円';
            }
          }
        }
      },
      scales: {
        x: {
          grid: {
            display: true
          }
        },
        y: {
          beginAtZero: true,
          ticks: {
            callback: v => v.toLocaleString() + '万円'
          },
          grid: {
            drawBorder: true,
            color: ctx => {
              return ctx.tick.value === 0 ? '#999999' : '#e5e7eb';
            },
            lineWidth: ctx => {
              return ctx.tick.value === 0 ? 3 : 1;
            }
          }
        }
      }
    }
  });
}

function drawPLChart(container, actualData, budgetData, showBudget = true) {
  const canvas = document.createElement('canvas');
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const headers = actualData[0];
  const colStart = 2;
  const allLabels = headers.slice(colStart, colStart + 12).filter(h => h && h !== '合計' && !h.includes('その他'));

  // 期間に応じたデータ範囲を決定
  const [startIdx, endIdx] = getPeriodRange(allLabels.length);
  const labels = allLabels.slice(startIdx, endIdx + 1);
  const dataColStart = colStart + startIdx;
  const dataColEnd = colStart + endIdx + 1;

  const actualRows = {};
  actualData.forEach(row => {
    if (!row || !row[0]) return;
    const itemName = String(row[0]).trim();

    if (itemName === '売上高合計') {
      actualRows['売上高'] = row;
    } else if (itemName === '売上総利益') {
      actualRows['売上総利益'] = row;
    } else if (itemName === '営業利益') {
      actualRows['営業利益'] = row;
    }
  });

  const budgetRows = {};
  budgetData.forEach(row => {
    if (!row || !row[0]) return;
    const itemName = String(row[0]).trim();

    if (itemName === '売上高合計') {
      budgetRows['売上高'] = row;
    } else if (itemName === '売上総利益') {
      budgetRows['売上総利益'] = row;
    } else if (itemName === '営業利益') {
      budgetRows['営業利益'] = row;
    }
  });

  const datasets = [];
  const colors = {
    '売上高': '#3b82f6',
    '売上総利益': '#10b981',
    '営業利益': '#000000'
  };

  ['売上高', '売上総利益', '営業利益'].forEach(key => {
    if (actualRows[key]) {
      const values = actualRows[key].slice(dataColStart, dataColEnd)
        .map(v => typeof v === 'number' ? Math.round(v / 10000) : 0);

      // 売上総利益の色を濃いオレンジに変更
      let color = colors[key];
      if (key === '売上総利益') color = '#d97706';

      datasets.push({
        label: key,
        data: values,
        borderColor: color,
        backgroundColor: 'transparent',
        borderWidth: 2,
        tension: 0.4,
        fill: false,
        borderDash: []
      });
    }
  });

  // 予算データを表示する場合のみ追加
  if (showBudget) {
    // 売上高の予算を追加（水色の破線）
    if (budgetRows['売上高']) {
      const values = budgetRows['売上高'].slice(dataColStart, dataColEnd)
        .map(v => typeof v === 'number' ? Math.round(v / 10000) : 0);
      datasets.push({
        label: '売上高（予算）',
        data: values,
        borderColor: '#06b6d4',
        backgroundColor: 'transparent',
        borderWidth: 2,
        tension: 0.4,
        fill: false,
        borderDash: [5, 5]
      });
    }

    // 売上総利益の予算を追加（薄いオレンジの破線）
    if (budgetRows['売上総利益']) {
      const values = budgetRows['売上総利益'].slice(dataColStart, dataColEnd)
        .map(v => typeof v === 'number' ? Math.round(v / 10000) : 0);
      datasets.push({
        label: '売上総利益（予算）',
        data: values,
        borderColor: '#fbbf24',
        backgroundColor: 'transparent',
        borderWidth: 2,
        tension: 0.4,
        fill: false,
        borderDash: [5, 5]
      });
    }

    // 営業利益の予算を追加（グレーの破線）
    if (budgetRows['営業利益']) {
      const values = budgetRows['営業利益'].slice(dataColStart, dataColEnd)
        .map(v => typeof v === 'number' ? Math.round(v / 10000) : 0);
      datasets.push({
        label: '営業利益（予算）',
        data: values,
        borderColor: '#9ca3af',
        backgroundColor: 'transparent',
        borderWidth: 2,
        tension: 0.4,
        fill: false,
        borderDash: [5, 5]
      });
    }
  }

  new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          mode: 'index',
          intersect: false,
          backgroundColor: 'rgba(0, 0, 0, 0.8)',
          titleColor: '#fff',
          bodyColor: '#fff',
          borderColor: '#ccc',
          borderWidth: 1,
          padding: 12,
          displayColors: true,
          callbacks: {
            title: function(context) {
              return context[0].label;
            },
            label: function(context) {
              const value = context.parsed.y;
              return context.dataset.label + ': ' + value.toLocaleString() + '万円';
            }
          }
        }
      },
      scales: {
        x: {
          grid: {
            display: true
          }
        },
        y: {
          beginAtZero: true,
          ticks: {
            callback: v => v.toLocaleString() + '万円'
          },
          grid: {
            drawBorder: true,
            color: ctx => {
              return ctx.tick.value === 0 ? '#999999' : '#e5e7eb';
            },
            lineWidth: ctx => {
              return ctx.tick.value === 0 ? 3 : 1;
            }
          }
        }
      }
    }
  });
}

function getPeriodRange(totalMonths) {
  switch (currentPeriod) {
    case 'q1': return [0, 2];      // 11月-1月
    case 'q2': return [3, 5];      // 2月-4月
    case 'q3': return [6, 8];      // 5月-7月
    case 'q4': return [9, 11];     // 8月-10月
    case 'h1': return [0, 5];      // 11月-4月
    case 'h2': return [6, 11];     // 5月-10月
    default: return [0, totalMonths - 1];  // 全期間
  }
}

function renderCFChart(container) {
  const sheet = allData.sheets?.['CF(見込+実績)'];

  if (!sheet || !Array.isArray(sheet.data)) {
    return;
  }

  // データ抽出
  let cashRow = null;
  let burnRow = null;
  let runwayRow = null;

  sheet.data.forEach(row => {
    if (!row || !row[0]) return;
    const itemName = String(row[0]).trim();
    if (itemName === '現預金残高') cashRow = row;
    else if (itemName === 'バーンレート') burnRow = row;
    else if (itemName === '月末時点ランウェイ') runwayRow = row;
  });

  if (!cashRow || !burnRow || !runwayRow) {
    return;
  }

  // グラフカード
  const chartCard = document.createElement('div');
  chartCard.className = 'card';
  chartCard.innerHTML = '<h2 class="text-lg font-semibold mb-4">キャッシュフロー推移</h2>';

  const chartContainer = document.createElement('div');
  chartContainer.className = 'chart-container';
  chartContainer.id = 'cf-chart-container';
  chartCard.appendChild(chartContainer);

  container.appendChild(chartCard);

  // メトリクスカード
  const metricsCard = document.createElement('div');
  metricsCard.className = 'card';
  metricsCard.style.display = 'grid';
  metricsCard.style.gridTemplateColumns = '1fr 1fr';
  metricsCard.style.gap = '24px';

  // 進行月は J列（7月）（インデックス 9）
  const latestBurn = burnRow[9] || 0;
  const latestRunway = runwayRow[9] || 0;

  const burnMetric = document.createElement('div');
  burnMetric.style.padding = '16px';
  burnMetric.style.border = '1px solid #e5e7eb';
  burnMetric.style.borderRadius = '6px';
  burnMetric.innerHTML = `
    <div style="font-size: 12px; color: #666; margin-bottom: 4px;">バーンレート（進行月）</div>
    <div style="font-size: 24px; font-weight: bold; color: #000;">
      ${(latestBurn / 10000).toLocaleString('ja-JP', {minimumFractionDigits: 1, maximumFractionDigits: 1})}
      <span style="font-size: 14px; color: #666;">万円/月</span>
    </div>
  `;

  const runwayMetric = document.createElement('div');
  runwayMetric.style.padding = '16px';
  runwayMetric.style.border = '1px solid #e5e7eb';
  runwayMetric.style.borderRadius = '6px';
  runwayMetric.innerHTML = `
    <div style="font-size: 12px; color: #666; margin-bottom: 4px;">ランウェイ（進行月）</div>
    <div style="font-size: 24px; font-weight: bold; color: #000;">
      ${(typeof latestRunway === 'number' ? latestRunway : 0).toLocaleString('ja-JP', {minimumFractionDigits: 1, maximumFractionDigits: 1})}
      <span style="font-size: 14px; color: #666;">ヶ月</span>
    </div>
  `;

  metricsCard.appendChild(burnMetric);
  metricsCard.appendChild(runwayMetric);

  container.appendChild(metricsCard);

  // バーンレート説明用注釈
  const burnNoteDiv = document.createElement('div');
  burnNoteDiv.style.padding = '12px 16px';
  burnNoteDiv.style.backgroundColor = '#f9fafb';
  burnNoteDiv.style.borderRadius = '6px';
  burnNoteDiv.style.fontSize = '12px';
  burnNoteDiv.style.lineHeight = '1.6';
  burnNoteDiv.style.color = '#333';
  burnNoteDiv.style.marginTop = '12px';
  burnNoteDiv.innerHTML = `
    上記のバーンレートおよびランウェイは<br>
    <br>
    <strong>定常キャッシュイン-定常キャッシュアウト-投資CF-財務CF</strong><br>
    <br>
    にて計算したもので、人材紹介の売上やスポットの経費は含まず<br>
    実際の現預金推移の見通しは上記グラフとなる。
  `;
  container.appendChild(burnNoteDiv);

  setTimeout(() => {
    drawCFChart(chartContainer, cashRow);

    // 注釈を追加
    const noteDiv = document.createElement('div');
    noteDiv.style.fontSize = '12px';
    noteDiv.style.color = '#666';
    noteDiv.style.marginTop = '12px';
    noteDiv.textContent = '※上記金額のうち3,000万円は預金担保見合いの短期借入となる。';
    chartCard.appendChild(noteDiv);
  }, 100);
}

function drawCFChart(container, cashRow) {
  const canvas = document.createElement('canvas');
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const allLabels = ['11月', '12月', '1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月'];
  const allValues = cashRow.slice(1, 13).map(v => typeof v === 'number' ? Math.round(v / 10000) : 0);

  // 期間に応じたデータ範囲を決定
  const [startIdx, endIdx] = getPeriodRange(allLabels.length);
  const labels = allLabels.slice(startIdx, endIdx + 1);
  const values = allValues.slice(startIdx, endIdx + 1);

  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '現預金残高',
        data: values,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59, 130, 246, 0.05)',
        borderWidth: 2,
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          mode: 'index',
          intersect: false,
          backgroundColor: 'rgba(0, 0, 0, 0.8)',
          titleColor: '#fff',
          bodyColor: '#fff',
          borderColor: '#ccc',
          borderWidth: 1,
          padding: 12,
          callbacks: {
            label: function(context) {
              const value = context.parsed.y;
              return context.dataset.label + ': ' + value.toLocaleString() + '万円';
            }
          }
        }
      },
      scales: {
        x: { grid: { display: true } },
        y: {
          beginAtZero: true,
          ticks: {
            callback: v => v.toLocaleString() + '万円'
          },
          grid: {
            drawBorder: true,
            color: '#e5e7eb'
          }
        }
      }
    }
  });
}

function renderIndicators() {
  const container = document.getElementById('indicators-content');
  container.innerHTML = '<div class="text-gray-600">事業指標タブ準備中</div>';
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
</html>
